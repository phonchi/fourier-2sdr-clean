[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-2sdr"
version = "0.1.0"
description = "Clean reference implementation for Fourier-domain two-stage dimension reduction"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
]

[project.scripts]
fourier-2sdr-experiment = "fourier_2sdr.experiments:main"

[project.optional-dependencies]
experiments = [
  "scipy>=1.13",
  "Pillow>=10",
  "matplotlib>=3.8",
]
notebook = [
  "jupyterlab>=4",
  "nbconvert>=7",
  "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
